name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.3.app || true

      - name: Build package
        run: swift build -v

      - name: Run tests with coverage
        run: |
          swift test --enable-code-coverage

  lint:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint and save warnings/errors
        run: |
          swiftlint lint --config .swiftlint.yml --reporter json > swiftlint_report.json || true

      - name: Upload SwiftLint report
        uses: actions/upload-artifact@v3
        with:
          name: swiftlint-report
          path: swiftlint_report.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
